
name: Import Shop Where SG Mall Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Import mall photographs
        run: python download_mall_photos.py

      - name: Commit imported photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mall-photos mall-photos.json
          git diff --cached --quiet || (git commit -m "Import licensed mall photographs" && git push)
