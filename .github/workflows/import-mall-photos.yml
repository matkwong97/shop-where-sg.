
name: Import licensed mall photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install Pillow

      - name: Download and optimise photographs
        run: python download_mall_photos.py

      - name: Save photographs to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mall-photos mall-photos.json
          git diff --cached --quiet || (git commit -m "Import licensed mall photographs" && git push)
